<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quantum Brief{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='htmx.min.js') }}"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a href="/" class="sidebar-brand">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="QB">
                <strong>Quantum Brief</strong>
            </a>
            <ul class="sidebar-nav">
                <li><a href="/" {% if request.path == '/' %}class="active"{% endif %}>
                    <span class="nav-icon">&#9633;</span> Dashboard
                </a></li>
                <li><a href="/sources" {% if '/sources' in request.path %}class="active"{% endif %}>
                    <span class="nav-icon">&#9881;</span> Sources
                </a></li>
                <li><a href="/articles" {% if '/articles' in request.path and '/sources' not in request.path %}class="active"{% endif %}>
                    <span class="nav-icon">&#9783;</span> Articles
                </a></li>
                <li><a href="/review" {% if '/review' in request.path %}class="active"{% endif %}>
                    <span class="nav-icon">&#9998;</span> Review
                </a></li>
                <li><a href="/calendar" {% if '/calendar' in request.path %}class="active"{% endif %}>
                    <span class="nav-icon">&#9776;</span> Calendar
                </a></li>
                <li><a href="/queue" {% if '/queue' in request.path %}class="active"{% endif %}>
                    <span class="nav-icon">&#9654;</span> Queue
                </a></li>
                <li><a href="/usage" {% if '/usage' in request.path %}class="active"{% endif %}>
                    <span class="nav-icon">&#9636;</span> Usage
                </a></li>
                <li><a href="/history" {% if '/history' in request.path %}class="active"{% endif %}>
                    <span class="nav-icon">&#8986;</span> History
                </a></li>
                <li><a href="/engagement" {% if '/engagement' in request.path %}class="active"{% endif %}>
                    <span class="nav-icon">&#9993;</span> Engagement
                </a></li>
                <li><a href="/limits" {% if '/limits' in request.path %}class="active"{% endif %}>
                    <span class="nav-icon">&#9888;</span> Limits
                </a></li>
                <li><a href="/settings" {% if '/settings' in request.path %}class="active"{% endif %}>
                    <span class="nav-icon">&#9881;</span> Settings
                </a></li>
            </ul>
        </aside>

        <main class="main-content">
            {% block content %}{% endblock %}

            <footer>
                Quantum Brief Bot
            </footer>
        </main>
    </div>

    <!-- Toast notifications -->
    <div id="toast-container" style="position:fixed;top:1rem;right:1rem;z-index:1000;display:flex;flex-direction:column;gap:0.5rem"></div>
    <script>
    document.body.addEventListener('showToast', function(evt) {
        var container = document.getElementById('toast-container');
        var toast = document.createElement('div');
        var type = (evt.detail && evt.detail.type) || 'info';
        toast.className = 'toast toast-' + type;
        toast.innerHTML = (evt.detail && evt.detail.message) || '';
        container.appendChild(toast);
        setTimeout(function() {
            toast.style.opacity = '0';
            setTimeout(function() { toast.remove(); }, 300);
        }, 4000);
    });
    </script>
</body>
</html>
