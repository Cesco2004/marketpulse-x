<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QEdge Intel{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='htmx.min.js') }}"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a href="/" class="sidebar-brand">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="QB">
                <strong>QEdge Intel</strong>
            </a>
            <ul class="sidebar-nav">
                <li class="nav-group-label">Operations</li>
                <li><a href="/" {% if request.path == '/' %}class="active"{% endif %}>
                    <span class="nav-icon">&#9633;</span> Command Center
                </a></li>
                <li><a href="/markets" {% if '/markets' in request.path or '/sources' in request.path %}class="active"{% endif %}>
                    <span class="nav-icon">&#127760;</span> Markets
                </a></li>
                <li><a href="/review" {% if '/review' in request.path %}class="active"{% endif %}>
                    <span class="nav-icon">&#9998;</span> Review
                </a></li>
                <li><a href="/pipeline" {% if '/pipeline' in request.path or '/queue' in request.path or '/history' in request.path %}class="active"{% endif %}>
                    <span class="nav-icon">&#9654;</span> Pipeline
                </a></li>
                <li class="nav-group-label">Insights</li>
                <li><a href="/analytics" {% if '/analytics' in request.path or '/calendar' in request.path %}class="active"{% endif %}>
                    <span class="nav-icon">&#9652;</span> Analytics
                </a></li>
                <li><a href="/engagement" {% if '/engagement' in request.path %}class="active"{% endif %}>
                    <span class="nav-icon">&#9993;</span> Engagement
                </a></li>
                <li class="nav-group-label">Config</li>
                <li><a href="/settings" {% if '/settings' in request.path or '/usage' in request.path or '/limits' in request.path %}class="active"{% endif %}>
                    <span class="nav-icon">&#9881;</span> Settings
                </a></li>
            </ul>
            <div style="padding:0.75rem 1rem;margin-top:auto;border-top:1px solid var(--border-color)">
                <a href="/logout" style="color:var(--text-tertiary);font-size:0.8rem">Logout</a>
            </div>
        </aside>

        <main class="main-content">
            {% block content %}{% endblock %}

            <footer>
                @QEdgeIntel
            </footer>
        </main>
    </div>

    <!-- Toast notifications -->
    <div id="toast-container" style="position:fixed;top:1rem;right:1rem;z-index:1000;display:flex;flex-direction:column;gap:0.5rem"></div>
    <script>
    document.body.addEventListener('showToast', function(evt) {
        var container = document.getElementById('toast-container');
        var toast = document.createElement('div');
        var type = (evt.detail && evt.detail.type) || 'info';
        toast.className = 'toast toast-' + type;
        toast.innerHTML = (evt.detail && evt.detail.message) || '';
        container.appendChild(toast);
        setTimeout(function() {
            toast.style.opacity = '0';
            setTimeout(function() { toast.remove(); }, 300);
        }, 4000);
    });
    </script>
</body>
</html>
